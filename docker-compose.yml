version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: always
    env_file:
      - apps/web/.env
    expose:
      - "3000"

  api:
    build:
      # Usamos apps/api-java porque es la carpeta real de tu backend
      context: ./apps/api-java
      dockerfile: Dockerfile
    restart: always

    expose:
      - "8080"

  proxy:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3002:80"
    depends_on:
      - web
      - api
