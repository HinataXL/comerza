version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: always
    env_file:
      - apps/web/.env
    expose:
      - "3000"

  api:
    build:
      context: ./apps/api-java
      dockerfile: Dockerfile
    container_name: comerza_api
    restart: always
    expose:
      - "8080"
    volumes:
      # Montamos el archivo físico del servidor directo al contenedor
      - ./apps/api-java/application.yml:/app/application.yml:ro

  proxy:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3002:80"
    depends_on:
      - web
      - api
